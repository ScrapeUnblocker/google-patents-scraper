[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-patents-scraper"
version = "0.1.0"
description = "Scrape Google Patents search results, full patent details, claims, citations, patent families and assignee landscapes as clean JSON or CSV, via the ScrapeUnblocker API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ScrapeUnblocker" }]
keywords = [
    "google-patents",
    "google-patents-scraper",
    "google-patents-api",
    "patent-search",
    "patent-data",
    "patent-analytics",
    "patent-landscape",
    "prior-art",
    "patent-citations",
    "intellectual-property",
    "web-scraping",
    "scraper",
    "scrapeunblocker",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["scrapeunblocker>=0.12,<1", "beautifulsoup4>=4.9"]

[project.urls]
Homepage = "https://scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"
Documentation = "https://docs.scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
google-patents-scraper = "google_patents_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
